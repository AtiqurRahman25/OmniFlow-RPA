<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DHL Technical Architecture</title>
<style>
:root{--bg:#F4F4F1;--card:#fff;--tx:#2C2C2A;--mu:#5F5E5A;--bd:#D3D1C7;--ac:#185FA5}
@media (prefers-color-scheme:dark){:root{--bg:#1B1B19;--card:#262624;--tx:#F1EFE8;--mu:#B4B2A9;--bd:#444441;--ac:#85B7EB}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Helvetica,Arial,sans-serif;line-height:1.5}
.wrap{max-width:880px;margin:0 auto;padding:24px 16px 40px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px}
.bar h1{font-size:16px;font-weight:600;margin:0}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-size:14px;padding:6px 14px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}
button:hover{border-color:var(--ac)}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.dl{background:var(--ac);border-color:var(--ac);color:#fff}
@media (prefers-color-scheme:dark){.dl{color:#0C1B2E}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px}
#d svg{display:block;width:100%;height:auto}
.lg{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.lg button{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:4px 10px}
.lg button[aria-pressed=true]{border-color:var(--tx)}
.dot{width:10px;height:10px;border-radius:2px;display:inline-block}
g[data-l]{transition:opacity .25s}
.fl{stroke-dasharray:5 4}
@media (prefers-reduced-motion:no-preference){.fl{animation:fl 1s linear infinite}}
@keyframes fl{to{stroke-dashoffset:-18}}
g[data-i]{cursor:pointer}
g[data-i]:focus-visible{outline:none}
g[data-i]:hover rect{stroke-width:2}
.info{margin-top:12px;padding:12px 14px;background:var(--card);border:1px solid var(--bd);border-radius:12px;font-size:14px;min-height:64px}
.info .dot{margin-right:6px}
.info .lt{color:var(--mu);font-size:12px;margin-left:6px}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <!-- <h1>Technical architecture diagram</h1> -->
    <div class="btns" role="group" aria-label="Download diagram">
      <button class="dl" data-f="svg">Download SVG</button>
      <button class="dl" data-f="jpg">Download JPG</button>
      <button class="dl" data-f="jpeg">Download JPEG</button>
    </div>
  </div>
  <div class="card"><div id="d"></div></div>
  <div class="lg" id="lg"></div>
  <div class="info" id="info" aria-live="polite"></div>
</div>
<script>
const W=680,H=830,DY=56;
const C={
ingest:['#E6F1FB','#185FA5','#0C447C','#0C447C','#85B7EB','#B5D4F4','#378ADD','Ingestion'],
ai:['#EEEDFE','#534AB7','#3C3489','#3C3489','#AFA9EC','#CECBF6','#7F77DD','AI extraction'],
pre:['#FAEEDA','#854F0B','#633806','#633806','#EF9F27','#FAC775','#BA7517','Pre-processing'],
transform:['#E1F5EE','#0F6E56','#085041','#085041','#5DCAA5','#9FE1CB','#1D9E75','Transformation'],
report:['#FAECE7','#993C1D','#712B13','#712B13','#F0997B','#F5C4B3','#D85A30','Report output'],
exc:['#FCEBEB','#A32D2D','#791F1F','#791F1F','#F09595','#F7C1C1','#E24B4A','Exception handling']};
const BANDS=[[20,'1  Ingestion layer'],[170,'2  Exception path (no attachment)',225,345],[320,'3  Extraction layer (parallel)'],[470,'4  Transformation layer'],[620,'5  Report generation layer']];
const FILE='<path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2z"/>';
const I={
mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
opened:'<path d="M3 9l9 6 9-6-9-6-9 6"/><path d="M21 9v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9"/><path d="M9 13l2 2 4-4"/>',
fetch:'<path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/><path d="M7 11l5 5 5-5"/><path d="M12 4v12"/>',
shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
savepdf:FILE+'<path d="M12 11v6"/><path d="M9 14l3 3 3-3"/>',
spark:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/>',
term:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3"/><path d="M13 15h4"/>',
braces:'<path d="M8 4c-2 0-3 1-3 3v2c0 1-1 3-2 3 1 0 2 2 2 3v2c0 2 1 3 3 3"/><path d="M16 4c2 0 3 1 3 3v2c0 1 1 3 2 3-1 0-2 2-2 3v2c0 2-1 3-3 3"/>',
merge:'<circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="12" r="2"/><path d="M6 7v2c0 3 3 3 10 3"/><path d="M6 17v-2c0-3 3-3 10-3"/>',
cube:'<path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5"/><path d="M12 12v9"/><path d="M12 12L4 7.5"/>',
sheet:FILE+'<path d="M8 13h8"/><path d="M8 17h8"/><path d="M12 11v8"/>',
export:'<path d="M12 5H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/><path d="M14 4h6v6"/><path d="M20 4l-9 9"/>',
table:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18"/><path d="M3 15h18"/><path d="M9 4v16"/>',
swap:'<path d="M4 8h16"/><path d="M16 4l4 4-4 4"/><path d="M20 16H4"/><path d="M8 12l-4 4 4 4"/>',
disk:'<path d="M6 4h10l4 4v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/><rect x="8" y="13" width="8" height="7"/><path d="M8 4v4h6V4"/>',
alert:FILE+'<path d="M12 11v3"/><path d="M12 17h.01"/>',
bell:'<path d="M10 5a2 2 0 1 1 4 0 7 7 0 0 1 4 6v3a4 4 0 0 0 2 3H4a4 4 0 0 0 2-3v-3a7 7 0 0 1 4-6"/><path d="M9 17v1a3 3 0 0 0 6 0v-1"/>'};
const B=[
['ingest',40,54,96,'Trigger','New email','mail','The Gmail Trigger starts the workflow whenever a new email arrives.'],
['ingest',166,54,96,'Mark read','Gmail API','opened','Marks the message as read so it is not processed twice.'],
['ingest',292,54,96,'Fetch mail','Full content','fetch','Gets the full message, including its attachment details.'],
['ingest',418,54,96,'Validate','Attachment?','shield','An If node checks that the email carries the defined attachment. If yes, the flow continues; if not, it takes the exception path.'],
['ingest',544,54,96,'Save PDF','To disk','savepdf','Writes the PDF attachment to local disk for the later steps.'],
['ai',40,354,290,'Gemini document analysis','Challan amount, date, TDS, + Confidence','spark','Google Gemini reads the whole PDF and returns the challan amount, date and TDS amount.'],
['pre',350,354,290,'Execute Command','Extract challan number, + Confidence','term','A shell command pulls the challan number out of the PDF.'],
['transform',40,504,135,'Shape data','Format for Excel','braces','A second Code node formats values and orders fields to match the Excel template.'],
['transform',215,504,170,'Merge','Combine both inputs','merge','Combines the Gemini fields (input 1) with the challan payload (input 2) into one item.'],
['pre',435,504,205,'Creates payload','Clean challan JSON','cube','A Code node turns the raw challan number into a clean JSON payload.'],
['report',40,654,96,'Template','From disk','sheet','Reads the Excel template file from disk.'],
['report',166,654,96,'Extract','XLSX to JSON','export','Extracts the template contents from the XLSX file.'],
['report',292,654,96,'Fill data','Map columns','table','A Code node maps the merged data into the template rows and columns.'],
['report',418,654,96,'Convert','JSON to XLSX','swap','Converts the filled data back into an XLSX file.'],
['report',544,654,96,'Write','Output file','disk','Writes the final XLSX report to disk.'],
['exc',395,204,160,'Log to Excel','Missing attachment','alert','When the email lacks the defined attachment, the case is logged to a separate Excel file instead of being processed.'],
['exc',240,204,125,'Notify owner','Send alert','bell','Notifies the responsible person that an email arrived without the defined attachment.']];
const P=[
['ingest','M138 88H164'],['ingest','M264 88H290'],['ingest','M390 88H416'],['ingest','M516 88H542'],
['exc','M466 124V202'],['exc','M393 238H367'],
['ingest','M592 124V352'],['ingest','M592 300H185V352'],
['ai','M300 424V502'],['pre','M537 424V502'],['pre','M433 538H387'],
['transform','M213 538H177'],['transform','M107 574V652'],
['report','M138 688H164'],['report','M264 688H290'],['report','M390 688H416'],['report','M516 688H542']];
const F='font-family="Segoe UI,Helvetica,Arial,sans-serif"';

function build(dark,live){
  const tx=dark?'#F1EFE8':'#2C2C2A', mu=dark?'#B4B2A9':'#5F5E5A', bd=dark?'#5F5E5A':'#B4B2A9';
  let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="DHL challan automation architecture">`;
  s+=`<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>`;
  if(!live) s+=`<rect width="${W}" height="${H}" fill="#fff"/>`;
  s+=`<text x="20" y="28" ${F} font-size="18" font-weight="700" fill="${tx}">DHL Automation WorkFlow: Technical Architecture Diagram</text>`;
  // s+=`<text x="20" y="46" ${F} font-size="12" fill="${mu}">n8n workflow: Gmail, Google Gemini, shell command, Excel output</text>`;
  s+=`<g transform="translate(0,${DY})">`;
  BANDS.forEach(b=>{
    s+=`<rect x="${b[2]||20}" y="${b[0]}" width="${b[3]||640}" height="112" rx="12" fill="none" stroke="${bd}" stroke-width="0.75" stroke-dasharray="4 4"/>`;
    s+=`<text x="${(b[2]||20)+20}" y="${b[0]+18}" ${F} font-size="12" fill="${mu}" dominant-baseline="central">${b[1]}</text>`;
  });
  B.forEach((b,n)=>{
    const c=C[b[0]], cx=b[1]+b[3]/2, y=b[2], ic=dark?c[5]:c[2];
    s+=`<g data-l="${b[0]}" data-i="${n}"${live?' tabindex="0" role="button" aria-label="'+b[4]+'. '+b[7]+'"':''}><rect x="${b[1]}" y="${y}" width="${b[3]}" height="68" rx="8" fill="${dark?c[3]:c[0]}" stroke="${dark?c[4]:c[1]}" stroke-width="0.75"/>`;
    s+=`<g transform="translate(${cx-11},${y+6}) scale(0.9167)" fill="none" stroke="${ic}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${I[b[6]]}</g>`;
    s+=`<text x="${cx}" y="${y+40}" ${F} font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="${ic}">${b[4]}</text>`;
    s+=`<text x="${cx}" y="${y+56}" ${F} font-size="12" text-anchor="middle" dominant-baseline="central" fill="${dark?c[4]:c[1]}">${b[5]}</text></g>`;
  });
  s+=`<g fill="none" stroke-width="1.5" stroke-linecap="round">`;
  P.forEach(p=>{s+=`<path${live?' class="fl"':''} stroke="${C[p[0]][6]}" marker-end="url(#ar)" d="${p[1]}"/>`});
  s+=`</g>`;
  s+=`<text x="529" y="79" ${F} font-size="11" text-anchor="middle" fill="${mu}">Yes</text>`;
  s+=`<text x="474" y="150" ${F} font-size="11" fill="${mu}">No</text>`;
  s+=`</g>`;
  s+=`<text x="20" y="${H-18}" ${F} font-size="12" fill="${mu}">Created by: Md. Atiqur Rahman Sifat (DFL) |  Attached Overleaf &amp; General Attachment  |  Version 1.0</text></svg>`;
  return s;
}

const dm=matchMedia('(prefers-color-scheme:dark)');
let sel=null,cur=null;
function showInfo(n){
  cur=n;const info=document.getElementById('info');
  if(n===null){info.innerHTML='Hover or select a node to see what it does.';}
  else{const b=B[n];info.innerHTML=`<span class="dot" style="background:${C[b[0]][6]}"></span><b>${b[4]}</b> <span class="lt">${C[b[0]][7]}</span><br>${b[7]}`;}
  document.querySelectorAll('#d g[data-i]').forEach(g=>{g.firstChild.setAttribute('stroke-width',+g.dataset.i===n?2.5:0.75)});
}
function render(){
  document.getElementById('d').innerHTML=build(dm.matches,true);
  document.querySelectorAll('#d g[data-l]').forEach(g=>{
    g.style.opacity=(!sel||g.dataset.l===sel)?1:.22;
    const n=+g.dataset.i;
    g.addEventListener('mouseenter',()=>showInfo(n));
    g.addEventListener('click',()=>showInfo(n));
    g.addEventListener('focus',()=>showInfo(n));
    g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();showInfo(n)}});
  });
  document.querySelectorAll('#lg button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.k===sel)));
  showInfo(cur);
}
const lg=document.getElementById('lg');
Object.keys(C).forEach(k=>{
  const b=document.createElement('button');
  b.dataset.k=k;b.setAttribute('aria-pressed','false');
  b.innerHTML=`<span class="dot" style="background:${C[k][6]}"></span>${C[k][7]}`;
  b.onclick=()=>{sel=sel===k?null:k;render()};
  lg.appendChild(b);
});
dm.addEventListener('change',render);
render();

function save(url,name){
  const a=document.createElement('a');a.href=url;a.download=name;
  document.body.appendChild(a);a.click();a.remove();
}
function exportAs(f){
  const svg=build(false,false), uri='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
  if(f==='svg'){save(uri,'dhl-challan-architecture.svg');return}
  const img=new Image();
  img.onload=()=>{
    const k=3,c=document.createElement('canvas');c.width=W*k;c.height=H*k;
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
    x.drawImage(img,0,0,c.width,c.height);
    c.toBlob(b=>save(URL.createObjectURL(b),'dhl-challan-architecture.'+f),'image/jpeg',.95);
  };
  img.onerror=()=>alert('Could not render the image. Check the diagram text for special characters such as & or <.');
  img.src=uri;
}
document.querySelectorAll('.dl').forEach(b=>b.onclick=()=>exportAs(b.dataset.f));
</script>
</body>
</html>
